services:
  database:
    image: postgres:16-alpine
    container_name: pricewatch-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricewatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricewatch_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pricewatch_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pricewatch_user} -d $${POSTGRES_DB:-pricewatch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: pricewatch-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricewatch-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricewatch_user}:${POSTGRES_PASSWORD:-pricewatch_pass}@database:5432/${POSTGRES_DB:-pricewatch_db}?schema=public
      PYTHON_SERVICE_URL: http://python-service:8000
      CORS_ORIGIN: "*"
    depends_on:
      database:
        condition: service_healthy
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricewatch-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: pricewatch_postgres_data
