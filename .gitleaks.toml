# Configuración de Gitleaks para PriceWatch.
# Extiende las reglas por defecto y añade una allowlist para las plantillas
# de ejemplo (.env*.example), cuyos valores son marcadores CAMBIA_* y no
# secretos reales.

[extend]
useDefault = true

[allowlist]
description = "Marcadores de plantilla CAMBIA_* en archivos de ejemplo"
regexes = [
  '''CAMBIA_(ESTE|ESTA|ESTO)_[A-Z0-9_]+''',
]
