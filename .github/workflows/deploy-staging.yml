name: Deploy staging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-push:
    name: Construir y publicar imágenes en GHCR
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Calcular prefijo de imágenes (minúsculas)
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${OWNER}/pricewatch" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar motor Python
        uses: docker/build-push-action@v6
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/python-service:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/python-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en staging con health check y rollback
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ vars.STAGING_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.STAGING_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            IMAGE_PREFIX="${{ needs.build-push.outputs.image_prefix }}" \
            IMAGE_TAG="${{ github.sha }}" \
            ./scripts/deploy.sh
