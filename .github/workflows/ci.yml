name: PriceWatch CI / DevSecOps

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  secret-scan:
    name: DevSecOps — Detección de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar escaneo con Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --verbose --redact --gitleaks-ignore-path=.gitleaksignore

  frontend:
    name: Frontend — Análisis, Compilación y Pruebas (Angular 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci || npm install


      - name: Compilar aplicación web
        run: npm run build

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm test -- --watch=false

  backend:
    name: Backend — Linter, Compilación y Pruebas (NestJS 11 + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Ejecutar análisis estático (oxlint)
        run: npm run lint

      - name: Compilar backend NestJS
        run: npm run build

      - name: Ejecutar pruebas unitarias (Jest)
        run: npm test

  python-service:
    name: Motor Analítico — Linter y Pruebas (FastAPI + MAUT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-service
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar estilo PEP8 (flake8)
        run: flake8 .

      - name: Ejecutar pruebas unitarias (pytest)
        run: pytest -v

  terraform:
    name: Infraestructura — Validación de Manifiesto Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init

      - name: Validar sintaxis declarativa
        run: terraform validate

      - name: Planificar ejecución de infraestructura
        run: terraform plan

  docker-build:
    name: Docker Compose — Construcción y Validación de Integración
    runs-on: ubuntu-latest
    needs: [frontend, backend, python-service, terraform]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar configuración de docker-compose
        run: docker compose config

      - name: Construir todas las imágenes de contenedores
        run: docker compose build
