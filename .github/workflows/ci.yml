name: PriceWatch CI / DevSecOps

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: DevSecOps — Detección de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar escaneo con Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --verbose --redact --gitleaks-ignore-path=.gitleaksignore

  frontend:
    name: Frontend — Análisis, Compilación y Pruebas (Angular 21 + Ionic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run lint

      - name: Compilar aplicación web/PWA
        run: npm run build

      - name: Ejecutar pruebas unitarias con cobertura (Vitest)
        run: npm run test:coverage

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

      - name: Publicar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend — Linter, Compilación, Pruebas y Cobertura (NestJS 11 + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Validar esquema de Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pricewatch_db?schema=public

      - name: Ejecutar análisis estático (oxlint)
        run: npm run lint

      - name: Compilar backend NestJS
        run: npm run build

      - name: Ejecutar pruebas unitarias con cobertura (Jest)
        run: npm run test:cov

      - name: Ejecutar pruebas e2e (Jest + Supertest)
        run: npm run test:e2e -- --runInBand

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=critical

      - name: Publicar cobertura del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  python-service:
    name: Motor Analítico — Linter, Pruebas, Cobertura y Auditoría (FastAPI + MAUT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-service
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar estilo PEP8 (flake8)
        run: flake8 .

      - name: Ejecutar pruebas con cobertura (pytest)
        run: pytest -v --cov=. --cov-report=term --cov-report=xml

      - name: Auditar dependencias de Python (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Publicar cobertura de Python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: python-service/coverage.xml
          if-no-files-found: ignore

  terraform:
    name: Infraestructura — Validación de Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Comprobar formato
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform
        run: terraform init

      - name: Validar sintaxis declarativa
        run: terraform validate

      - name: Planificar ejecución de infraestructura
        run: terraform plan

      - name: Inicializar Terraform Docker staging
        working-directory: ./infra/docker-staging
        run: terraform init -input=false

      - name: Validar Terraform Docker staging
        working-directory: ./infra/docker-staging
        run: terraform validate

      - name: Planificar Terraform Docker staging
        working-directory: ./infra/docker-staging
        env:
          TF_VAR_postgres_password: ci-password
        run: terraform plan -input=false -no-color

  docker-build:
    name: Contenedores — Construcción y Escaneo de Imágenes (Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scan, frontend, backend, python-service, terraform]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar configuración de docker-compose
        run: docker compose config -q

      - name: Construir todas las imágenes
        run: docker compose build

      - name: Escanear imagen del backend (vulnerabilidades críticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pricewatch-backend:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Escanear imagen del frontend (vulnerabilidades críticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pricewatch-frontend:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

      - name: Escanear imagen del motor Python (vulnerabilidades críticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pricewatch-python-service:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

  integration:
    name: Integración — Flujo completo con Docker Compose y smoke test
    runs-on: ubuntu-latest
    needs: [secret-scan, frontend, backend, python-service, terraform]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar variables de entorno de CI
        run: cp .env.example .env

      - name: Validar Docker Compose
        run: docker compose config -q

      - name: Levantar el stack completo
        run: docker compose up --build -d

      - name: Ejecutar smoke test del flujo completo
        run: bash scripts/smoke-test.sh

      - name: Mostrar logs si falla la integración
        if: failure()
        run: docker compose logs --tail=200

      - name: Detener y limpiar el stack
        if: always()
        run: docker compose down -v

  quality-gate:
    name: Quality Gate — bloquear si falla un control
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - frontend
      - backend
      - python-service
      - terraform
      - docker-build
      - integration
    steps:
      - name: Confirmar controles obligatorios
        run: echo "Todos los controles obligatorios pasaron."
